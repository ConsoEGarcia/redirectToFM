<!DOCTYPE html>
<html>
<head>
  <title>Redirecting...</title>
  <script>
    // 1. Define a reusable sleep function
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    
    async function WaitAFew() {
      console.log("Starting...");
      // 2. Pause for 1000 milliseconds (1 second)
      await sleep(2000);
      console.log("1 second later!");
    }
    
    function redirect() {
      const params = new URLSearchParams(window.location.search);
      const target = params.get("rerouteTo");

      if (target) {
        try {
          const url = new URL(target);

          // OPTIONAL: restrict domains for safety
          /*const allowed = ["myotherwebsite.com"];
          if (allowed.includes(url.hostname)) {
            window.location.href = target;
          } else {
            document.body.innerHTML = "<h3>Invalid redirect domain</h3>";
          }*/
          //window.open(target);
          window.location.href = target;
          WaitAFew();
          //window.close;

          
          const newWin = window.open(target, "_blank");
          window.close;


        } catch {
          document.body.innerHTML = "<h3>Invalid URL</h3>";
        }
      } else {
        document.body.innerHTML = "<h3>No redirect parameter found</h3>";
      }
    }
  </script>
</head>
